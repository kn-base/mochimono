<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="持ち物">
  <meta name="robots" content="noindex">
  <!-- 安全対策：GitHub以外とは通信しない（トークンを外に送らせないため）。外部のプログラムも読み込まない -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>持ち物</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top" id="top">
    <div class="top-row">
      <div class="brand">
        <p class="brand-kicker" id="kicker">Belongings</p>
        <h1 class="brand-title">
          <button type="button" class="mode is-active" data-mode="items" aria-pressed="true">持ち物</button><span class="mode-sep" aria-hidden="true">/</span><button type="button" class="mode" data-mode="cons" aria-pressed="false">消耗品</button>
        </h1>
        <p class="brand-stats" id="stats"></p>
      </div>
      <div class="top-btns">
        <button class="icon-btn" id="summary-btn" type="button" aria-label="ジャンル別の合計">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h10M5 17h6"/></svg>
        </button>
        <button class="icon-btn" id="settings-btn" type="button" aria-label="設定">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="ジャンルの絞り込み"></nav>
  </header>

  <main class="list-wrap" id="list"></main>

  <button class="add-btn" id="add-btn" type="button" aria-label="持ち物を追加">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- 詳細・集計（右から重なる画面） -->
  <section class="panel" id="panel" hidden>
    <div class="panel-body" id="panel-body"></div>
  </section>

  <div class="overlay" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <form id="form" novalidate></form>
    </div>
  </div>

  <div class="overlay overlay-confirm" id="confirm" hidden>
    <div class="confirm-card" role="alertdialog" aria-modal="true">
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-ghost" id="confirm-no">やめる</button>
        <button type="button" class="btn btn-danger" id="confirm-yes">削除する</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
